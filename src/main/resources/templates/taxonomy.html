<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="|${kind.title()} — Court Panel|">Manage Taxonomy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="app">
    <div th:replace="~{fragments/layout :: sidebar('settings')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="content">
        <div class="breadcrumb">
          <a th:href="@{/settings}">Settings</a>
          <span>/</span>
          <span th:text="${kind.breadcrumbLabel()}">Case Statuses</span>
        </div>

        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title" th:text="${kind.title()}">
              Manage Case Statuses
            </h1>
            <p class="page-subtitle" th:text="${kind.subtitle()}">
              Configure the values used across the system.
            </p>
          </div>
        </div>

        <div
          class="alert alert--success"
          th:if="${successMessage}"
          th:text="${successMessage}"
        >
          Added successfully.
        </div>
        <div
          class="alert alert--error"
          th:if="${errorMessage}"
          th:text="${errorMessage}"
        >
          Something went wrong.
        </div>

        <!-- Add card -->
        <section
          class="detail-panel tax-add"
          sec:authorize="hasAuthority('CASE_CREATE')"
        >
          <h2 class="tax-add-title" th:text="${kind.addTitle()}">Add New</h2>
          <form class="tax-add-form" method="post" th:action="@{/settings/{s}(s=${kind.slug()})}">
            <div class="tax-add-field">
              <input
                class="form-input"
                type="text"
                name="name"
                autocomplete="off"
                th:placeholder="${kind.placeholder()}"
              />
            </div>
            <button type="submit" class="btn-primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              <span th:text="${kind.addButtonLabel()}">Add</span>
            </button>
          </form>
        </section>

        <!-- Table -->
        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th th:text="${kind.nameHeader()}">Name</th>
                  <th th:if="${kind.showBadge()}">Badge Preview</th>
                  <th th:text="${kind.countHeader()}">Count</th>
                  <th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="row : ${rows}">
                  <td class="muted" th:text="${row.idLabel}">1</td>
                  <td>
                    <span class="cell-strong" th:text="${row.displayName}">Open</span>
                  </td>
                  <td th:if="${kind.showBadge()}">
                    <span
                      class="badge"
                      th:classappend="${row.badgeClass}"
                      th:text="${row.displayName}"
                      >Open</span
                    >
                  </td>
                  <td>
                    <span
                      th:if="${kind.countPill()}"
                      class="count-pill"
                      th:text="${#numbers.formatInteger(row.count, 1, 'COMMA')}"
                      >0</span
                    >
                    <span
                      th:unless="${kind.countPill()}"
                      th:text="${#numbers.formatInteger(row.count, 1, 'COMMA')}"
                      >0</span
                    >
                  </td>
                  <td class="col-actions">
                    <span sec:authorize="hasAuthority('CASE_CREATE')">
                      <form
                        th:if="${row.deletable}"
                        method="post"
                        th:action="@{/settings/{s}/{id}/delete(s=${kind.slug()},id=${row.id})}"
                        class="tax-del-form"
                      >
                        <button
                          type="submit"
                          class="tax-del tax-del--active"
                          title="Delete"
                          aria-label="Delete"
                        >
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
                        </button>
                      </form>
                      <span
                        th:unless="${row.deletable}"
                        class="tax-del tax-del--locked"
                        th:title="|In use by ${row.count} record(s) — cannot delete|"
                        aria-label="Locked"
                      >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
                      </span>
                    </span>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                  <td colspan="5" class="table-empty">No entries yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <p class="tax-footnote" th:if="${kind.footnote()}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span th:text="${kind.footnote()}">Locked entries cannot be deleted.</span>
        </p>
      </main>
    </div>
  </body>
</html>
