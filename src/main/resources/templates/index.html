<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Court Panel — Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        background: #f7f9fb;
        color: #191c1e;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 32px;
        background: linear-gradient(135deg, #131b2e 0%, #1e293b 100%);
        color: #fff;
      }
      .topbar h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.3px;
      }
      .logout-btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        padding: 8px 16px;
        cursor: pointer;
      }
      .logout-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .content {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #c6c6cd;
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
      }
      .greeting {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 800;
      }
      .muted {
        color: #45464d;
        font-size: 14px;
      }
      .roles {
        margin-top: 20px;
        font-size: 13px;
        color: #45464d;
      }
      .badge {
        display: inline-block;
        background: #eef1f8;
        color: #4059aa;
        border-radius: 999px;
        padding: 4px 10px;
        margin: 0 6px 6px 0;
        font-weight: 700;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Court Panel</h1>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Sign out</button>
      </form>
    </header>

    <main class="content">
      <div class="card">
        <p class="greeting">
          Welcome, <span th:text="${displayName}">Greffier</span>
        </p>
        <p class="muted">
          Signed in as <span th:text="${username}">username</span>
        </p>
        <div class="roles">
          <span
            sec:authorize="hasRole('CHIEF_GREFFIER')"
            class="badge"
            >Chief Greffier</span
          >
          <span sec:authorize="hasRole('GREFFIER')" class="badge">Greffier</span>
          <span sec:authorize="hasRole('ADMINISTRATOR')" class="badge"
            >Administrator</span
          >
        </div>
        <p class="muted" style="margin-top: 24px">
          This is a placeholder dashboard. Greffier workflows (docket
          management, hearing schedules, case dispositions) will be built here.
        </p>
      </div>
    </main>
  </body>
</html>
