<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Participant Not Found - Court Panel</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="app">
    <div th:replace="~{fragments/layout :: sidebar('participants')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="content content--form">
        <div class="empty-state">
          <h1 class="page-title">Participant not found</h1>
          <p class="page-subtitle">
            The participant may have been removed, or the link may be incorrect.
          </p>
          <a th:href="@{/participants}" class="btn-primary">Back to Participants</a>
        </div>
      </main>
    </div>
  </body>
</html>
