<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="|${profile.name} - Court Panel|">Participant Profile</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="app">
    <div th:replace="~{fragments/layout :: sidebar('participants')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="content content--detail">
        <div class="breadcrumb">
          <a th:href="@{/participants}">Participants</a>
          <span>&gt;</span>
          <span th:text="${profile.name}">Michael Henderson</span>
        </div>

        <div th:replace="~{fragments/participant-header :: header(${profile})}"></div>
        <div th:replace="~{fragments/participant-header :: tabs(${profile}, 'documents')}"></div>

        <form
          class="toolbar toolbar--inline"
          method="get"
          th:action="@{/participants/{id}/documents(id=${profile.participantId})}"
        >
          <div class="field field--search">
            <div class="input-wrap">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input
                class="input"
                type="search"
                name="query"
                th:value="${query}"
                placeholder="Search documents..."
              />
            </div>
          </div>

          <select class="select" name="documentType" onchange="this.form.submit()">
            <option value="">All Document Types</option>
            <option
              th:each="type : ${documentTypes}"
              th:value="${type.code}"
              th:text="${type.label}"
              th:selected="${type.code == selectedDocumentType}"
            ></option>
          </select>
        </form>

        <section class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Document Name</th>
                  <th>Type</th>
                  <th>Case Number</th>
                  <th>Date Filed</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="document : ${documentPage.content}">
                  <td>
                    <span th:text="${document.title}">Affidavit of Residency</span>
                    <span class="confidential-note" th:if="${document.confidential}">Confidential</span>
                  </td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${document.badgeClass}"
                      th:text="${document.documentType}"
                      >Filing</span
                    >
                  </td>
                  <td>
                    <a
                      class="cell-link"
                      th:href="@{/cases/{caseId}(caseId=${document.caseId})}"
                      th:text="${document.caseNumber}"
                      >CR-2026-0881</a
                    >
                  </td>
                  <td th:text="${document.uploadedDate}">Jan 15, 2026</td>
                  <td class="table-actions">
                    <a
                      th:href="@{/cases/{caseId}/documents/{documentId}(caseId=${document.caseId}, documentId=${document.documentId})}"
                      title="View"
                      aria-label="View document"
                      >
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </a>
                  </td>
                </tr>
                <tr th:if="${documentPage.empty}">
                  <td colspan="5" class="table-empty">No documents found.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination" th:if="${documentPage.totalPages > 1}">
            <span
              class="pagination-info"
              th:text="|Page ${documentPage.number + 1} of ${documentPage.totalPages}|"
              >Page 1 of 1</span
            >
            <div class="pagination-btns">
              <a
                class="page-btn"
                th:classappend="${documentPage.first} ? 'page-btn--disabled' : ''"
                th:href="${documentPage.first} ? '#' : @{/participants/{id}/documents(id=${profile.participantId},query=${query},documentType=${selectedDocumentType},page=${documentPage.number - 1})}"
                >&lt; Previous</a
              >
              <a
                class="page-btn"
                th:classappend="${documentPage.last} ? 'page-btn--disabled' : ''"
                th:href="${documentPage.last} ? '#' : @{/participants/{id}/documents(id=${profile.participantId},query=${query},documentType=${selectedDocumentType},page=${documentPage.number + 1})}"
                >Next &gt;</a
              >
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
