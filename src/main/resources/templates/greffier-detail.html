<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="|Assigned Cases - ${greffierName}|">
      Assigned Cases - Court Panel
    </title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="app">
    <div th:replace="~{fragments/layout :: sidebar('greffier')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="content">
        <div
          class="alert alert--success"
          th:if="${successMessage}"
          th:text="${successMessage}"
        >
          Case assigned successfully.
        </div>
        <div
          class="alert alert--error"
          th:if="${errorMessage}"
          th:text="${errorMessage}"
        >
          Could not assign case.
        </div>

        <!-- Page header -->
        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title">Assigned Cases</h1>
            <p class="page-subtitle">
              Greffier: <span th:text="${greffierName}">Sarah Chen</span>
            </p>
          </div>
        </div>

        <!-- Results card -->
        <div class="table-card">
          <!-- Search -->
          <form
            class="table-toolbar"
            method="get"
            th:action="@{/greffiers/{id}(id=${greffierId})}"
          >
            <div class="input-wrap table-search">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input
                class="input"
                type="text"
                name="query"
                th:value="${query}"
                placeholder="Search case number or title..."
              />
            </div>
          </form>

          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Case Number</th>
                  <th>Case Title</th>
                  <th>Classification</th>
                  <th>Status</th>
                  <th>Assigned By</th>
                  <th>Assigned At</th>
                  <th class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="row : ${page.content}">
                  <td>
                    <span class="cell-strong" th:text="${row.caseNumber}"
                      >2023-CR-0192</span
                    >
                  </td>
                  <td th:text="${row.title}">State v. Harrison</td>
                  <td>
                    <span
                      class="badge badge--slate"
                      th:text="${row.classification}"
                      >Felony</span
                    >
                  </td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${row.badgeClass}"
                      th:text="${row.status}"
                      >Pre-Trial</span
                    >
                  </td>
                  <td class="muted" th:text="${row.assignedBy}">Hon. J. Davis</td>
                  <td class="muted" th:text="${row.assignedAt}">
                    Oct 12, 2023, 09:15 AM
                  </td>
                  <td class="col-actions">
                    <a
                      th:href="@{/cases/{caseId}(caseId=${row.caseId})}"
                      class="icon-action"
                      title="View case"
                      aria-label="View case"
                    >
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </a>
                  </td>
                </tr>
                <tr th:if="${page.empty}">
                  <td colspan="7" class="table-empty">
                    No cases assigned to this greffier yet.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Footer: Back + pagination -->
          <div class="pagination">
            <a th:href="@{/greffiers}" class="btn-primary btn-back">Back</a>
            <div class="pagination-pages" th:if="${page.totalPages > 1}">
              <a
                class="page-num page-chevron"
                th:classappend="${page.first} ? 'page-num--disabled' : ''"
                th:href="${page.first} ? '#' : @{/greffiers/{id}(id=${greffierId},query=${query},page=${page.number - 1})}"
                aria-label="Previous page"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              </a>
              <a
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                class="page-num"
                th:classappend="${i == page.number} ? 'page-num--active' : ''"
                th:href="@{/greffiers/{id}(id=${greffierId},query=${query},page=${i})}"
                th:text="${i + 1}"
                >1</a
              >
              <a
                class="page-num page-chevron"
                th:classappend="${page.last} ? 'page-num--disabled' : ''"
                th:href="${page.last} ? '#' : @{/greffiers/{id}(id=${greffierId},query=${query},page=${page.number + 1})}"
                aria-label="Next page"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
