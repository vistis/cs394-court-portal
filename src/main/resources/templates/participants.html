<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Participants — Court Panel</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body class="app">
    <div th:replace="~{fragments/layout :: sidebar('participants')}"></div>

    <div class="app-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="content">
        <!-- Page header -->
        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title">Participants</h1>
            <p class="page-subtitle">
              Search and manage all participant profiles across the system.
            </p>
          </div>
          <a
            th:href="@{/participants/add}"
            class="btn-primary"
            sec:authorize="hasAuthority('CASE_CREATE')"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add Participant</span>
          </a>
        </div>

        <!-- Search &amp; filter toolbar -->
        <form class="toolbar toolbar--inline" method="get" th:action="@{/participants}">
          <div class="field field--search">
            <div class="input-wrap">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input
                class="input"
                type="text"
                name="query"
                th:value="${query}"
                placeholder="Search by name or case ID..."
              />
            </div>
          </div>

          <div class="filter-dropdown" data-filter-dropdown>
            <button type="button" class="btn-light filter-toggle" data-filter-toggle>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>Filter</span>
            </button>
            <div class="filter-dropdown-menu" data-filter-menu>
              <div class="field">
                <label class="field-label">Party Type</label>
                <select class="select" name="partyType">
                  <option value="">All</option>
                  <option
                    th:each="type : ${partyTypeOptions}"
                    th:value="${type}"
                    th:text="${type}"
                    th:selected="${selectedPartyType != null and selectedPartyType == type}"
                  ></option>
                </select>
              </div>
              <div class="filter-dropdown-actions">
                <button type="submit" class="btn-secondary btn-secondary--sm">Apply</button>
                <a th:href="@{/participants}" class="btn-link">Clear</a>
              </div>
            </div>
          </div>
        </form>

        <div
          class="alert alert--success"
          th:if="${successMessage}"
          th:text="${successMessage}"
        >
          Participant registered successfully.
        </div>

        <!-- Results table -->
        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Party Type</th>
                  <th>Contact Info</th>
                  <th class="text-center">Involved Cases</th>
                  <th class="table-actions-header">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="row : ${page.content}">
                  <td th:text="${row.name}">Participant Name</td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${row.badgeClass}"
                      th:text="${row.partyType}"
                      >Individual</span
                    >
                  </td>
                  <td th:text="${row.primaryEmail}">name@example.com</td>
                  <td class="text-center" th:text="${row.involvedCases}">0</td>
                  <td class="table-actions table-actions--center">
                    <a
                      th:href="@{/participants/{id}(id=${row.participantId})}"
                      title="View Profile"
                      aria-label="View profile"
                      >
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </a>
                  </td>
                </tr>
                <tr th:if="${page.empty}">
                  <td colspan="5" class="table-empty">
                    No participants found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination">
            <span
              class="pagination-info"
              th:text="|Page ${page.number + 1} of ${page.totalPages == 0 ? 1 : page.totalPages}|"
              >Page 1 of 1</span
            >
            <div class="pagination-btns">
              <a
                class="page-btn"
                th:classappend="${page.first} ? 'page-btn--disabled' : ''"
                th:href="${page.first} ? '#' : @{/participants(query=${query},partyType=${selectedPartyType},page=${page.number - 1})}"
                >&lt; Previous</a
              >
              <a
                class="page-btn"
                th:classappend="${page.last} ? 'page-btn--disabled' : ''"
                th:href="${page.last} ? '#' : @{/participants(query=${query},partyType=${selectedPartyType},page=${page.number + 1})}"
                >Next &gt;</a
              >
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="/js/script.js"></script>
  </body>
</html>
