server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: court-portal

  datasource:
    url: ${SQL_URL:jdbc:postgresql://localhost:5432/court}
    username: ${SQL_USER:court}
    password: ${SQL_PASSWORD:}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${SQL_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/}
      database: ${MONGODB_DATABASE:court}
      uuid-representation: standard

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: false

  storage:
    s3:
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket-name: ${S3_BUCKET_NAME:}
      public-url: ${S3_PUBLIC_URL:}
