server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: COURT_PORTAL_SESSION

spring:
  application:
    name: court-portal

  # Content-hash static resource URLs (e.g. /css/app-<hash>.css) so browsers
  # always fetch the latest CSS/JS instead of serving a stale cached copy.
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

  session:
    redis:
      namespace: court:portal:session

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${SQL_URL:jdbc:postgresql://localhost:5432/court}
    username: ${SQL_USER:court}
    password: ${SQL_PASSWORD:}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${SQL_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/}
      database: ${MONGODB_DATABASE:court}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: false

  storage:
    s3:
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket-name: ${S3_BUCKET_NAME:}
      public-url: ${S3_PUBLIC_URL:}

  cache:
    redis:
      time-to-live: 300000
